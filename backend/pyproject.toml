[project]
name = "ynym-portal-backend"
version = "0.1.0"
description = "FastAPI backend system for ynym portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "greenlet>=3.5.5",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pytest-mock",
]

# uv に関する設定
[tool.uv]
## 1週間のクールダウンを設定
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"
markers = [
    "unit: Mark test as unit test",
    "integration: Mark test as integration test",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "PIE",    # flake8-pie
    "RUF",    # Ruff-specific rules
]
ignore = [
    "RUF001", # 全角文字列警告
    "RUF002", # Docstring内の全角文字警告
    "RUF003", # コメント内の全角文字警告
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Body",
    "fastapi.params.Body",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Path",
    "fastapi.params.Path",
]

